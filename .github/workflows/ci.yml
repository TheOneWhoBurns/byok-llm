name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, typecheck, package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - name: Check the exports map and type declarations of the packed tarball
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack .

  test:
    name: Test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every release line covered by "engines" in package.json.
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Load the built package as CommonJS and as ESM
        run: |
          node -e "const m = require('./dist/index.cjs'); if (typeof m.init !== 'function') process.exit(1)"
          node --input-type=module -e "const m = await import('./dist/index.js'); if (typeof m.init !== 'function') process.exit(1)"
